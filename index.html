    <div class="backdrop closeForm" id="backdrop"></div>
    <div class="movieModal" id="movieModal">

        <form action="" id="movieForm">
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <h4 id="movietitle">Add Movie</h4>
                    <i role="button" id="closeFormBtn" class="fa-solid fa-xmark fa-2x closeForm"></i>
                </div>

                <div class="card-body">
                    <div class="form-group">
                        <label for="movieName">Enter Movie Name</label>
                        <input type="text" id="movieName" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="movieImg">Enter Image URL</label>
                        <input type="url" id="movieImg" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="movieDescription">Enter Movie Description</label>
                        <textarea type="text" id="movieDescription" rows="4" class="form-control"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="movieRating">Give Rating</label>
                        <select name="" id="movieRating" class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="datetime-local" id="year" class="form-control">
                    </div>


                    <div class="form-group">
                        <label for="genre">Genre</label>
                        <select name="" id="genre" class="form-control">
                            <option value="">Select Genre</option>
                            <option value="action">Action</option>
                            <option value="comedy">Comedy</option>
                            <option value="drama">Drama</option>
                            <option value="horror">Horror</option>
                            <option value="romance">Romance</option>
                            <option value="thriller">Thriller</option>
                        </select>
                    </div>
                </div>

                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" id="submitmoviebtn" class="btn btn-sm net-sec-btn">Add Movie</button>
                    <button type="button" id="updateMoviebtn" class="btn btn-sm net-sec-btn d-none">Update
                        Movie</button>
                    <button type="button" class="btn btn-sm net-pri-btn closeForm" id="cancel">Cancel</button>
                </div>
            </div>
        </form>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-success" role="status">
            <span class="sr-only">Loading...</span>
        </div>
